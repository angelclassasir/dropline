[package]
name = "dropline"
version = "1.1.0"
edition = "2021"
rust-version = "1.75"
description = "Dropline core: headless video fetcher bridge for After Effects"
license = "MIT"
repository = "https://github.com/angelclassasir/dropline"
authors = ["ZapNap"]

# The artifact is called dropline-core.exe so it can be copied into bin/ as-is
[[bin]]
name = "dropline-core"
path = "src/main.rs"

[dependencies]
serde_json = "1"
dirs = "6.0"

[profile.release]
strip = true
